# cargo-deny configuration (run in CI: `cargo deny check advisories licenses sources`)

[graph]
all-features = true

[advisories]
# RustSec advisories, including unmaintained crates, are errors.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
