[package]
name = "novastack"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Scaffold Axum backends that compile: REST, HTMX, gRPC, realtime and minimal templates, plugins (auth, metrics, Redis, workers) and a component generator"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cybercoretech/NovaStack"
homepage = "https://novastack-rs.pages.dev"
documentation = "https://docs.rs/novastack"
readme = "README.md"
keywords = ["scaffold", "axum", "backend", "sqlx", "cli"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
# Ship the CLI, its embedded templates, tests and docs; not the website or CI config.
include = [
    "/src/**",
    "/templates/**",
    "/templates_shared/**",
    "/tests/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[[bin]]
name = "novastack"
path = "src/main.rs"

[lib]
name = "novastack_core"
path = "src/lib.rs"

[dependencies]
# CLI & Terminal UX
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = { version = "0.12", default-features = false, features = ["editor", "password"] }
console = "0.16"

# Templating & Embedded Assets
minijinja = { version = "2.7", features = ["loader"] }
rust-embed = "8.5"

# Serialization & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"

# Filesystem & Utilities
which = "8.0"
heck = "0.5"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"
