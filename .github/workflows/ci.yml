name: CI

# NovaStack's own checks plus the generated-project compile matrix
# (tests/generated_compile.rs): every archetype, database and plugin combination must
# build clean under `clippy -D warnings` and pass its own tests.
#
# Generated projects have no lockfile, so a new crate release can break them without
# any change here. The weekly run catches that drift.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Must match `rust-version` in Cargo.toml and GENERATED_RUST_VERSION in
  # src/scaffold/engine.rs.
  MSRV: "1.88"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked

  msrv:
    name: test (MSRV 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  generated:
    name: generated projects (${{ matrix.shard }}, ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: base + plugins
            toolchain: stable
            tests: >-
              gen_no_db_no_plugins gen_postgres_no_plugins gen_sqlite_no_plugins
              gen_each_plugin_alone gen_postgres_all_plugins gen_sqlite_all_plugins
              gen_add_plugins_and_generate_components
          - shard: htmx + realtime
            toolchain: stable
            tests: gen_htmx_archetype gen_htmx_postgres gen_realtime_archetype
          - shard: grpc
            toolchain: stable
            tests: gen_grpc_archetype
          - shard: minimal
            toolchain: stable
            tests: gen_minimal_archetype gen_minimal_add_plugins_and_generate_components
          # Every archetype with sqlite + all plugins on the pinned MSRV
          - shard: archetypes
            toolchain: "1.88"
            tests: >-
              gen_sqlite_all_plugins gen_htmx_archetype gen_grpc_archetype
              gen_realtime_archetype gen_minimal_archetype
    env:
      # Generated projects are built by `cargo` subprocesses; this makes them use the
      # same toolchain as the job.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: generated-${{ matrix.shard }}-${{ matrix.toolchain }}
          # Dependencies of the generated projects (shared target dir of the matrix)
          cache-directories: target/tmp/generated-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile matrix
        run: cargo test --locked --test generated_compile -- --ignored --exact ${{ matrix.tests }}

  cross-platform:
    name: ${{ matrix.os }} (tests + generated projects)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.os }}
          cache-directories: target/tmp/generated-check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: NovaStack tests
        run: cargo test --locked
      # sqlite + every plugin (SQLx, auth, metrics, redis, workers), grpc (build.rs with the
      # bundled protoc) and htmx (Askama template paths) on this OS
      - name: Generated projects
        run: cargo test --locked --test generated_compile -- --ignored --exact gen_sqlite_all_plugins gen_grpc_archetype gen_htmx_archetype

  docker-smoke:
    name: docker smoke (${{ matrix.scenario }})
    # Image builds are slow; run on main, weekly and on demand rather than every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One per template; see scripts/docker-smoke.sh for what each checks.
        scenario: [rest, grpc, htmx, realtime, minimal]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build novastack
        run: cargo build --locked --release
      - name: Smoke-test the generated project in Docker
        run: ./scripts/docker-smoke.sh "$PWD/target/release/novastack" "$RUNNER_TEMP/smoke" ${{ matrix.scenario }}

  demo-units:
    name: demo units (quadlet + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts
        run: shellcheck demo/install.sh scripts/docker-smoke.sh
      - name: Quadlet units generate cleanly
        # Podman 5.8's own generator, in its official image; fails on any unknown key or bad reference.
        run: |
          docker run --rm -v "$PWD/demo/quadlet:/units:ro" -e QUADLET_UNIT_DIRS=/units \
            quay.io/podman/stable:v5.8.7 /usr/libexec/podman/quadlet -dryrun -user > generated.txt 2> quadlet.log || { cat quadlet.log; exit 1; }
          if grep -iE 'error|unsupported|invalid' quadlet.log; then exit 1; fi
          for unit in demo-postgres demo-rest demo-htmx demo-realtime demo-grpc demo-cloudflared; do
            grep -q -- "---$unit.service---" generated.txt || { echo "missing $unit.service"; exit 1; }
          done
          # No unit may publish a port: the tunnel is the only way in.
          if grep -E -- '--publish|-p [0-9]' generated.txt; then echo "a demo unit publishes a port"; exit 1; fi
          echo "6 container units generated, no published ports"
      - name: Reset units are valid systemd units
        # demo-postgres.service only exists once Quadlet has generated it on the host
        run: |
          out=$(systemd-analyze verify --man=no demo/systemd/novastack-demo-reset.service demo/systemd/novastack-demo-reset.timer 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -v 'demo-postgres.service' | grep -q .; then exit 1; fi
